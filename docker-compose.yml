services:
  users-service:
      image: saransh76/users-service:latest
      container_name: users-service
      ports:
        - "8003:8003"   # expose your Go app (change if your app uses different port)
      env_file:
        - .env
      restart: unless-stopped
      networks:
      - microservices-network

networks:
    microservices-network:
      external: true